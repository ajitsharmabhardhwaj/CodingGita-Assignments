<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inline vs Preformatted Code</title>
</head>
<body>

    <!-- Inline code example -->
    <p>
        You can change text color in CSS using the property <code>color: red;</code>.
    </p>

    <!-- Preformatted code block -->
    <pre>
git init
git add .
git commit -m "Initial commit"
git push origin main
    </pre>

</body>
</html>
