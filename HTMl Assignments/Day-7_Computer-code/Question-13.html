<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Semantic Elements Demo</title>
</head>
<body>

    <!-- Inline code example -->
    <p>
        You can center text in CSS using the property <code>text-align: center;</code>.
    </p>

    <!-- Keyboard shortcut example -->
    <p>
        To paste copied content, press <kbd>Ctrl + V</kbd> on your keyboard.
    </p>

    <!-- Sample output example -->
    <p>
        When the program runs successfully, it displays <samp>Execution Complete</samp> on the screen.
    </p>

</body>
</html>
