<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Styled kbd and pre Example</title>

    <style>
        /* Styled keyboard input */
        kbd {
            background-color: #f5f5f5;
            border: 1px solid #ccc;
            border-radius: 4px;
            padding: 4px 8px;
            font-family: monospace;
            box-shadow: 0 2px 0 #ccc;
        }

        /* Styled preformatted code block */
        pre {
            background-color: #1e1e1e;
            color: #ffffff;
            padding: 15px;
            border-radius: 10px;
            font-family: monospace;
            overflow-x: auto;
        }
    </style>
</head>
<body>

    <h2>Keyboard Shortcut Example</h2>
    <p>
        Press <kbd>Ctrl</kbd> + <kbd>S</kbd> to save your file.
    </p>

    <h2>Code Block Example</h2>
    <pre>
def greet(name):
    print("Hello, " + name)

greet("Preeyaansh")
    </pre>

</body>
</html>
