<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multiple Email Input</title>
</head>
<body>

    <form>
        <!-- Label -->
        <label for="emails">Enter Email Addresses:</label>

        <!-- Email Input with multiple -->
        <input 
            type="email" 
            id="emails" 
            name="emails" 
            multiple 
            placeholder="Enter emails separated by commas">
    </form>

</body>
</html>
