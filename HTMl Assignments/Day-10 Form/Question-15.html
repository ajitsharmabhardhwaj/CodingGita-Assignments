<!DOCTYPE html>
<html lang="en">
<head>
    <title>Button Types Example</title>
</head>
<body>

    <form>
        <!-- Submit Button -->
        <button type="submit">Submit Form</button>

        <!-- Reset Button -->
        <button type="reset">Reset Form</button>

        <!-- Normal Button -->
        <button type="button">Click Me</button>
    </form>

</body>
</html>
