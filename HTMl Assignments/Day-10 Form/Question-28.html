<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>URL Input</title>
</head>
<body>

    <h2>Enter Your Website</h2>

    <form>
        <!-- Label -->
        <label for="website">Website URL:</label>

        <!-- URL Input -->
        <input 
            type="url" 
            id="website" 
            name="website"
            required
            placeholder="https://example.com">
    </form>

</body>
</html>
