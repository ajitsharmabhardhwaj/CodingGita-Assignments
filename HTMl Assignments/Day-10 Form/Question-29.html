<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Search Field</title>
</head>
<body>

    <h2>Search</h2>

    <form>
        <!-- Label -->
        <label for="search">Search:</label>

        <!-- Search Input with Autofocus -->
        <input 
            type="search" 
            id="search" 
            name="search"
            placeholder="Search here..."
            autofocus>
    </form>

</body>
</html>
