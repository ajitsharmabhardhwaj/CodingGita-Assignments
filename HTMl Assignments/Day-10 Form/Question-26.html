<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Color Picker</title>
</head>
<body>

    <h2>Select Your Favorite Color</h2>

    <form>
        <!-- Label -->
        <label for="favcolor">Choose a color:</label>

        <!-- Color Picker -->
        <input 
            type="color" 
            id="favcolor" 
            name="favcolor"
            value="#ff0000">
    </form>

</body>
</html>
