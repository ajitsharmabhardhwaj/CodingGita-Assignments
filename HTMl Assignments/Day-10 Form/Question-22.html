<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quantity Input</title>
</head>
<body>

    <form>
        <!-- Label -->
        <label for="quantity">Select Quantity (1–10):</label>

        <!-- Number Input -->
        <input 
            type="number" 
            id="quantity" 
            name="quantity"
            min="1" 
            max="10" 
            step="1">
    </form>

</body>
</html>
