<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Volume Slider</title>
</head>
<body>

    <form>
        <!-- Label -->
        <label for="volume">Volume:</label>

        <!-- Range Slider -->
        <input 
            type="range" 
            id="volume" 
            name="volume"
            min="0" 
            max="100" 
            value="50">
    </form>

</body>
</html>
