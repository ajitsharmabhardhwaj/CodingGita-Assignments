<!DOCTYPE html>
<html lang="en">
<head>
    <title>Fieldset Example</title>
</head>
<body>

    <form>
        <fieldset>
            <legend>Personal Information</legend>

            <!-- Input 1 -->
            <label for="name">Name:</label>
            <input type="text" id="name" name="name"><br><br>

            <!-- Input 2 -->
            <label for="email">Email:</label>
            <input type="email" id="email" name="email">
        </fieldset>
    </form>

</body>
</html>
