<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Date Input (2023 Only)</title>
</head>
<body>

    <form>
        <!-- Label -->
        <label for="date">Select a date (2023 only):</label>

        <!-- Date Input restricted to 2023 -->
        <input 
            type="date" 
            id="date" 
            name="date"
            min="2023-01-01"
            max="2023-12-31">
    </form>

</body>
</html>
