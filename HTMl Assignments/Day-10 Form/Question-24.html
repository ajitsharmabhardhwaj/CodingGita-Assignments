<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>File Upload (PDF & DOCX)</title>
</head>
<body>

    <h2>Upload Your Document</h2>

    <!-- 
        enctype="multipart/form-data" is required for file uploads
    -->
    <form action="/upload.php" method="post" enctype="multipart/form-data">

        <!-- File Input -->
        <label for="document">Choose a file (PDF or DOCX only):</label>
        <input 
            type="file" 
            id="document" 
            name="document"
            accept=".pdf,.docx"
            required>

        <br><br>

        <!-- Submit Button -->
        <input type="submit" value="Upload">

    </form>

</body>
</html>
