<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Attribute Example</title>
</head>
<body>

    <h2>Form with External Input</h2>

    <!-- Form with ID -->
    <form id="userForm" action="/submit.php" method="post">
        <label for="name">Name:</label>
        <input type="text" id="name" name="name"><br><br>

        <input type="submit" value="Submit">
    </form>

    <br>

    <!-- Input placed OUTSIDE the form but linked using form attribute -->
    <label for="email">Email (outside form):</label>
    <input 
        type="email" 
        id="email" 
        name="email" 
        form="userForm"
        placeholder="Enter your email">

</body>
</html>
