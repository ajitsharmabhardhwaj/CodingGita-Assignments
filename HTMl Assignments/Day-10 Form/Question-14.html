<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Comment Box</title>
</head>
<body>

    <h2>Leave a Comment</h2>

    <form>
        <label for="comments">Your Message:</label><br>
        <textarea 
            id="comments" 
            name="comments" 
            rows="4" 
            cols="50" 
            placeholder="Write your message here...">
        </textarea>
    </form>

</body>
</html>
