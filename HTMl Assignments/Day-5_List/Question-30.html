<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <section>

  <h2>Complete List Demonstration</h2>

  <!-- Unordered list with specific bullet type -->
  <ul type="square">
    <li>Frontend Technologies
      <!-- Nested ordered list inside unordered list -->
      <ol type="A">
        <li>HTML</li>
        <li>CSS</li>
        <li>JavaScript</li>
      </ol>
    </li>

    <li>Backend Technologies</li>
  </ul>

  <!-- Ordered list with type, start, and reversed -->
  <ol type="1" start="5" reversed>
    <li>Deployment</li>
    <li>Testing</li>
    <li>Development</li>
    <li>Planning</li>
  </ol>

  <!-- Description list -->
  <dl>
    <dt>HTML</dt>
    <dd>Markup language used to structure web pages.</dd>

    <dt>CSS</dt>
    <dd>Style sheet language used for designing web pages.</dd>
  </dl>

</section>
</body>
</html>
