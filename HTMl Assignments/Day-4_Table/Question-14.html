<!DOCTYPE html>
<html lang="en">
<head>

<body>

      <th id="science" scope="col">Science</th>

    <tr>

      <td headers="aman science">90</td>

    <tr>
      <th id="riya" scope="row">Riya</th>
      <td headers="riya math">92</td>
      <td headers="riya science">88</td>
    </tr>
  </tbody>
</table>
</body>
</html>
