<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <p>
        Price: &euro;99 (Euro using named entity)
    </p>

    <p>
        Price: &#x20AC;99 (Euro using hexadecimal entity)
    </p>

    <p>
        Price: &pound;85 (Pound using named entity)
    </p>

    <p>
        Price: &#163;85 (Pound using decimal entity)
    </p>

    <p>
        Price: &yen;12000 (Yen using named entity)
    </p>
</body>
</html>
