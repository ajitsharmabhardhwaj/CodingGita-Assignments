<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Iframe</title>
</head>
<body>

    <h2>Interactive Demo</h2>

    <iframe
        src="https://www.example.com"
        width="800"
        height="450"
        title="Interactive Demo with Gyroscope Support"
        allow="fullscreen; gyroscope"
        allowfullscreen
        style="border: none;">
    </iframe>

</body>
</html>
