<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Link with Iframe</title>
</head>
<body>

    <h2>Load Website in Iframe</h2>

    <!-- Clickable Link -->
    <a href="https://www.example.com" target="myFrame">
        Open Example Site
    </a>

    <br><br>

    <!-- Iframe -->
    <iframe 
        name="myFrame" 
        width="100%" 
        height="300"
        style="border: none;">
    </iframe>

</body>
</html>
