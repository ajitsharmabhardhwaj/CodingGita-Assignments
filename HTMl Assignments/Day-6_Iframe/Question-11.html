<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Navigation with Iframe</title>
</head>
<body>

    <h2>Navigation Menu</h2>

    <!-- Navigation Links -->
    <nav>
        <a href="https://www.example.com" target="contentFrame">Example</a> |
        <a href="https://www.wikipedia.org" target="contentFrame">Wikipedia</a> |
        <a href="https://www.openai.com" target="contentFrame">OpenAI</a>
    </nav>

    <br><br>

    <!-- Iframe -->
    <iframe
        name="contentFrame"
        width="100%"
        height="400"
        style="border: none;"
        title="Content Display Area">
    </iframe>

</body>
</html>
