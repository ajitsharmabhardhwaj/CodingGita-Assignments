<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Responsive Video Player</title>

  <style>
    /* Responsive 16:9 container */
    .video-container {
      width: 80%;
      margin: auto;
      aspect-ratio: 16 / 9;
      position: relative;
    }

    .video-container iframe {
      width: 100%;
      height: 100%;
      border: none;
    }

    /* Mobile full width */
    @media (max-width: 768px) {
      .video-container {
        width: 100%;
      }
    }
  </style>
</head>

<body>

  <div class="video-container">
    <iframe 
      src="https://www.youtube.com/embed/dQw4w9WgXcQ"
      allow="fullscreen; gyroscope"
      allowfullscreen>
    </iframe>
  </div>

</body>
</html>
