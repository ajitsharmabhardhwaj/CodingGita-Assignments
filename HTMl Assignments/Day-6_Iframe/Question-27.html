<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iframe Navigation Page</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
    }

    ul {
      list-style: none;
      padding: 0;
    }

    li {
      margin-bottom: 10px;
    }

    a {
      text-decoration: none;
      color: #0077cc;
      font-weight: bold;
    }

    iframe {
      width: 100%;
      height: 400px;
      margin-top: 20px;
      border: 2px solid #333;
      border-radius: 8px;
    }
  </style>
</head>

<body>

  <h2>Load Pages into Iframe</h2>

  <ul>
    <li><a href="https://example.com" target="contentFrame">Open Example</a></li>
    <li><a href="https://www.wikipedia.org" target="contentFrame">Open Wikipedia</a></li>
    <li><a href="https://www.openai.com" target="contentFrame">Open OpenAI</a></li>
  </ul>

  <iframe 
    class="contentFrame"
    title="Content Display Frame"
    allow="fullscreen"
    allowfullscreen>
  </iframe>

</body>
</html>
