<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Interactive Full-Page Iframe Layout</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      height: 70px;
      background: #111;
      color: #fff;
      display: flex;
      align-items: center;
      padding: 0 20px;
      font-size: 20px;
      font-weight: bold;
      letter-spacing: 0.5px;
    }

    .iframe-container {
      flex: 1; /* takes remaining height */
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
    }
  </style>
</head>

<body>

  <header>
    Premium Media Dashboard
  </header>

  <div class="iframe-container">
    <iframe 
      src="https://www.youtube.com/embed/dQw4w9WgXcQ"
      title="Full Page Interactive Video Frame"
      allow="fullscreen; gyroscope; usb"
      allowfullscreen>
    </iframe>
  </div>

</body>
</html>
