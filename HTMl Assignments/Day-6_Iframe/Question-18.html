<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minimal Permission Iframe</title>
</head>
<body>

    <h2>Fullscreen Only Iframe</h2>

    <iframe
        src="https://www.example.com"
        width="100%"
        height="500"
        title="Example Website with Fullscreen Access Only"
        allow="fullscreen">
    </iframe>

</body>
</html>
