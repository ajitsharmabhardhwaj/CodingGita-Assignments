<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Best Practice Iframe Usage</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 20px;
      background: #f7f7f7;
    }

    h1 {
      text-align: center;
      margin-bottom: 30px;
    }

    .iframe-section {
      margin-bottom: 40px;
    }

    iframe {
      width: 100%;
      max-width: 800px;
      height: 400px;
      border: none;
      display: block;
      margin-top: 10px;
      border-radius: 8px;
    }
  </style>
</head>

<body>

  <h1>Iframe Best Practices Demo</h1>

  <div class="iframe-section">
    <!-- This iframe embeds a simple webpage that does not require any special device or browser permissions -->
    <h2>Standard Webpage Embed</h2>
    <iframe 
      src="https://example.com"
      title="Standard Webpage Content">
    </iframe>
  </div>

  <div class="iframe-section">
    <!-- This iframe may benefit from fullscreen viewing and gyroscope support (e.g., immersive video or 360° content) -->
    <h2>Interactive Media (Fullscreen + Gyroscope)</h2>
    <iframe 
      src="https://www.youtube.com/embed/dQw4w9WgXcQ"
      title="Interactive Media Player"
      allow="fullscreen; gyroscope"
      allowfullscreen>
    </iframe>
  </div>

  <div class="iframe-section">
    <!-- This iframe requires USB access for connecting to external devices (e.g., hardware tools or demos using WebUSB) -->
    <h2>USB-Enabled Application</h2>
    <iframe 
      src="https://example.com"
      title="USB Device Interaction Frame"
      allow="usb">
    </iframe>
  </div>

</body>
</html>
