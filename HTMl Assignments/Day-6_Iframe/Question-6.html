<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iframe Gyroscope Only</title>
</head>
<body>

    <h2>Interactive Content (Gyroscope Permission Only)</h2>

    <iframe
        src="https://www.youtube.com/embed/dQw4w9WgXcQ"
        width="100%"
        height="500"
        title="Interactive Video with Gyroscope Support"
        allow="gyroscope">
    </iframe>

</body>
</html>
