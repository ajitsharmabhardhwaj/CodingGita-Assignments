<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iframe with Fullscreen & USB</title>
</head>
<body>

    <h2>Fullscreen + USB Enabled Iframe</h2>

    <iframe
        src="https://www.example.com"
        width="700"
        height="450"
        title="Example Site with Fullscreen and USB Access"
        allow="fullscreen; usb"
        style="border: none;">
    </iframe>

</body>
</html>
