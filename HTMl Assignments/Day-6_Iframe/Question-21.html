<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Device Loader</title>

    <style>
        .btn-link {
            display: inline-block;
            padding: 10px 18px;
            background-color: #333;
            color: #fff;
            text-decoration: none;
            border-radius: 6px;
            font-family: Arial, sans-serif;
        }

        .btn-link:hover {
            background-color: #555;
        }

        iframe {
            width: 100%;
            height: 350px;
            border: none;
            margin-top: 20px;
        }
    </style>
</head>
<body>

    <h2>Device Control Loader</h2>

    <!-- Button-like Link -->
    <a href="https://www.example.com" target="myDeviceFrame" class="btn-link">
        Load Device Content
    </a>

    <!-- Iframe -->
    <iframe
        name="myDeviceFrame"
        title="Device Control Interface"
        allow="usb">
    </iframe>

</body>
</html>
