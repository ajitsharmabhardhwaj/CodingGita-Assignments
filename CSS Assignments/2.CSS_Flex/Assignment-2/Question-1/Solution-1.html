<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    * {
  box-sizing: border-box;
}

.navbar {
  display: flex;
  width: 100%;
  height: 80px;
  padding: 0 30px;
  background: #eae8e8;
  color: rgb(4, 4, 4);
  /* align-content: center; */
  align-items: center;
  justify-content: space-between;
  flex: 1;
}

.logo {
  font-size: 24px;
  font-weight: bold;
  display: flex;
  gap: 10px;
}

.nav-links {
  display: flex;
  list-style: disc;
  padding: 0;
  margin: 0;
  gap: 25px;
}

.nav-links li {
  display: block;
}

.auth-buttons {
  display: block;
  gap: 10px;
}

button {
  padding: 10px 18px;
  border: none;
}
.btn{
  background-color: blue;
  color: white;
}
.name{
  border: 1px solid blue;
  background-color: blue;
  width: 25px;
  height: 25px;
  border-radius: 50%;
}
  </style>
</head>
<body>
  <header class="navbar">
  <div class="logo">
    <div class="name"></div>CodeAcademy</div>

  <ul class="nav-links">
    <li>Home</li>
    <li>Courses</li>
    <li>Projects</li>
    <li>Contact</li>
    <li>About</li>
  </ul>

  <div class="auth-buttons">
    <button>Login</button>
    <button class="btn">Signup</button>
  </div>
</header>
</body>
</html>
